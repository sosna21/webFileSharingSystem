<div class="modal-header">
  <h4 class="modal-title">{{ title() }}</h4>
  <button
    type="button"
    class="btn-close"
    aria-label="Close"
    (click)="activeModal.dismiss()"
  ></button>
</div>

<div class="modal-body">
  <p style="white-space: pre-wrap;">{{ message() }}
      @if (showPermanentDeleteWarning()) {
    <span class="text-danger"><br>This operation can not be undone.</span>
  }
  </p>
</div>

<div class="modal-footer">
  <button
    type="button"
    class="btn btn-outline-secondary"
    (click)="activeModal.dismiss()"
  >
    {{ cancelText() }}
  </button>
  <button
    type="button"
    class="btn btn-danger"
    ngbAutofocus
    (click)="activeModal.close(true)"
  >
    {{ confirmText() }}
  </button>
</div>
