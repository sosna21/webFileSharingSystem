<div
  class="container-fluid px-4 pt-2 pb-1 d-flex flex-column overflow-scroll"
  [class.pb-4]="!showPagination()"
  style="max-height: 100%"
>
  <ng-content select="app-base-disc-page-header"></ng-content>
  <ng-content></ng-content>

  <div>
    <!-- <span>Files per page: </span>
    <input
      class="me-2"
      type="number"
      [(ngModel)]="itemsPerPage"
      placeholder="Items per page"
    /> -->
    @if (loadingData()) { @defer(on timer(100ms)) {
    <span>Loading...</span>
    } }
  </div>
  <div class="overflow-scroll m" style="max-height: 100%; min-height: 400px">
    <ng-content select="table">
      <app-base-table />
    </ng-content>
  </div>

  @if (showPagination()) {
  <ngb-pagination
    class="d-flex justify-content-center mt-3"
    [collectionSize]="totalItems()"
    [pageSize]="itemsPerPage()"
    [(page)]="currentPage"
    [boundaryLinks]="true"
    [maxSize]="6"
  />
  }
</div>
