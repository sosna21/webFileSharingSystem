<header
  class="d-flex flex-wrap align-items-center pb-1 mb-4 border-bottom rounded-bottom-2 column-gap-4 column-gap-md-5"
>
  <div
    class="d-flex align-items-baseline text-nowrap flex-grow-1 flex-md-grow-0"
  >
    <div class="fs-1 me-2">
      <ng-content select="i"></ng-content>
    </div>
    <span class="fs-2 fw-semibold"><ng-content>Page title</ng-content></span>
    <app-file-search class="d-block d-md-none ms-3 flex-grow-1" />
  </div>
  <div class="d-flex fs-2">
    <ng-content select="[secondaryContent]"></ng-content>
  </div>
</header>
