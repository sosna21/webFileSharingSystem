<app-base-disc-page>
  <app-base-disc-page-header
    (tableMenuRequested)="userFilesView.openTableContextMenu()"
    (fileMenuRequested)="userFilesView.openFileContextMenu()"
  >
    <i class="bi bi-hourglass-split d-flex text-warning-emphasis"></i>
    <ng-container i18n>Recent files</ng-container>
    <app-file-actions-strip secondaryContent />
  </app-base-disc-page-header>

  <app-user-files-view #userFilesView data-view />
</app-base-disc-page>
