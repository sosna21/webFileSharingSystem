<app-base-disc-page>
  <app-base-disc-page-header
    (tableMenuRequested)="sharedFilesView.openTableContextMenu()"
    (fileMenuRequested)="sharedFilesView.openFileContextMenu()"
  >
    <i class="bi bi-people-fill d-flex text-primary-emphasis"></i>
    <ng-container i18n>Shared with me</ng-container>
    <app-file-actions-strip secondaryContent />
  </app-base-disc-page-header>
  <app-breadcrumb class="mt-n2" />
  <app-shared-files-view #sharedFilesView data-view />
</app-base-disc-page>
