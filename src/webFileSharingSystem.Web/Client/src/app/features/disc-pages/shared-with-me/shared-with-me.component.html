<app-base-disc-page>
  <app-base-disc-page-header>
    <i class="bi bi-people-fill text-primary-emphasis"></i>
    Shared with me
    <app-file-actions-strip secondaryContent />
  </app-base-disc-page-header>
  <app-breadcrumb class="mt-n2" />
  @if (viewMode() === "grid") {
    <app-shared-files-grid data-view />
  } @else {
    <app-shared-files-table data-view />
  }
</app-base-disc-page>
