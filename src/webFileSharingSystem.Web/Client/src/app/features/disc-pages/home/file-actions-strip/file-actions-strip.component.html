<div class="d-flex align-items-center gap-3 mt-2" directoryCreation>
  <i
    class="bi bi-folder-plus action-icon action-warning"
    data-testid="directory-create-trigger"
    [class.disabled]="!canCreateDirectory()"
    (click)="initDirCreation()"
    ngbTooltip="Create new folder"
    [openDelay]="300"
  ></i>
  @if (showDirCreateNameInput()) {
    <div>
      <input
        appSelectFilename
        type="text"
        class="form-control"
        data-testid="directory-create-input"
        placeholder="New folder"
        required
        [(ngModel)]="newFolderName"
        (keyup.enter)="createDirectory()"
        (blur)="cancelRename()"
        (keyup.escape)="cancelRename()"
      />
      @if (isNameForbidden()) {
        <div class="text-danger fw-lighter fs-6">
          "{{ newFolderName() }}" already exists.
        </div>
      }
    </div>
  }
</div>
<div class="vr h-75 mt-auto"></div>
<div class="align-self-center d-flex gap-4 h-100 align-items-end">
  <i
    class="bi bi-scissors action-icon action-primary disabled"
    [class.disabled]="!canFileAction()"
    ngbTooltip="Cut"
    [openDelay]="300"
    (click)="onCut()"
  ></i>
  <i
    class="bi bi-copy action-icon action-primary disabled"
    [class.disabled]="!canCopy()"
    ngbTooltip="Copy"
    [openDelay]="300"
    (click)="onCopy()"
  ></i>
  <i
    class="bi bi-clipboard action-icon action-primary disabled"
    [class.disabled]="!canPaste()"
    ngbTooltip="Paste"
    [openDelay]="300"
    (click)="onPaste()"
  ></i>
  <div class="vr h-75 mt-auto"></div>
  <i
    class="bi bi-download action-icon action-primary disabled"
    [class.disabled]="!canFileAction()"
    ngbTooltip="Download"
    [openDelay]="300"
    (click)="onDownload()"
  ></i>
  <i
    class="bi bi-pencil action-icon action-primary disabled"
    [class.disabled]="!canRename()"
    ngbTooltip="Rename"
    [openDelay]="300"
    (click)="onRename()"
  ></i>

  @if (!viewingSharedFiles()) {
    <i
      class="bi bi-share action-icon action-primary disabled"
      [class.disabled]="!canFileAction()"
      ngbTooltip="Share"
      [openDelay]="300"
      (click)="onShare()"
    ></i>
  }

  <i
    class="bi bi-trash action-icon action-danger disabled"
    [class.disabled]="!canDelete()"
    ngbTooltip="Delete"
    [openDelay]="300"
    (click)="onDelete()"
  ></i>
</div>
