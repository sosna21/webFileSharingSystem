<div
  data-testid="profile-photo-dropzone-drop-zone"
  class="drop-zone mb-3 rounded-4 text-center p-5 cursor-pointer transition-all bg-body-tertiary"
  [class.drag-over]="isDragOver()"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)"
  (drop)="onDrop($event)"
  (click)="fileInput.click()"
  tabindex="0"
  role="button"
  aria-label="Upload profile photo"
>
  <input
    #fileInput
    data-testid="profile-photo-dropzone-input"
    type="file"
    class="d-none"
    accept="image/jpeg,image/png"
    (change)="onPhotoSelected($event)"
  />

  <i class="bi bi-cloud-arrow-up fs-2 text-secondary mb-2"></i>

  <p class="mb-1 fw-medium">Drag and drop your new photo here</p>

  <p class="text-secondary small mb-3">
    or click to browse from your computer (JPEG or PNG, up to 5 MB)
  </p>

  <button
    data-testid="profile-photo-dropzone-browse"
    class="btn btn-outline-primary btn-sm"
    (click)="fileInput.click(); $event.stopPropagation()"
  >
    Browse files
  </button>
</div>
