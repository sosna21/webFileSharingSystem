<div class="text-center mb-4">
  <h5 class="mb-3">Adjust your profile picture</h5>

  <div
    data-testid="profile-image-cropper-container"
    class="cropper-wrapper bg-light rounded-3 d-inline-block p-3 border"
    style="width: 100%; max-width: 500px"
  >
    <image-cropper
      data-testid="profile-image-cropper-canvas"
      [imageFile]="selectedPhoto()"
      [maintainAspectRatio]="true"
      [aspectRatio]="1 / 1"
      [roundCropper]="true"
      format="webp"
      [canvasRotation]="0"
      [resizeToWidth]="256"
      [autoCrop]="true"
      [initialStepSize]="20"
      (imageCropped)="imageCropped($event)"
    ></image-cropper>
  </div>

  @if (selectedPhotoName()) {
    <p
      data-testid="profile-image-cropper-file-name"
      class="small text-secondary mt-2"
    >
      Uploading: {{ selectedPhotoName() }}
    </p>
  }
</div>

<div class="d-flex justify-content-end gap-2">
  <button
    data-testid="profile-image-cropper-cancel"
    type="button"
    class="btn btn-outline-secondary"
    (click)="onCancel()"
    [disabled]="isUploading()"
  >
    Cancel
  </button>

  <button
    data-testid="profile-image-cropper-save"
    type="button"
    class="btn btn-primary"
    [disabled]="!croppedImageBlob() || isUploading()"
    (click)="onSave()"
  >
    @if (isUploading()) {
      <span
        class="spinner-border spinner-border-sm me-1"
        role="status"
        aria-hidden="true"
      ></span>
      Saving...
    } @else {
      Save photo
    }
  </button>
</div>
