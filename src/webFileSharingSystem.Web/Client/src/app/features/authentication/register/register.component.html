@let controls = $any(registerForm.controls!);
<app-base-auth-page [(loading)]="loading">
  <app-card-main-content [errorMsg]="error()">
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <app-text-input
        [formControl]="controls['username']"
        label="Username"
        i18n-label
        [testId]="'register-username'"
      ></app-text-input>
      <app-text-input
        [formControl]="controls['email']"
        label="Email (optional)"
        i18n-label
        [testId]="'register-email'"
      ></app-text-input>
      <app-text-input
        [formControl]="controls['password']"
        label="Password"
        i18n-label
        [type]="'password'"
        [testId]="'register-password'"
      ></app-text-input>
      <app-text-input
        [formControl]="controls['confirmPassword']"
        label="Confirm Password"
        i18n-label
        [type]="'password'"
        [testId]="'register-confirm-password'"
      ></app-text-input>
      <app-main-action-btn [loading]="loading()" [testId]="'register-submit'">
        <ng-container i18n>Register</ng-container>
      </app-main-action-btn>
    </form>
  </app-card-main-content>
  <app-card-secondary-content>
    <ng-container i18n
      >You already have an account? <br />
      Click Login to go to a Login page!
    </ng-container>
    <button
      class="btn btn-secondary btn-block"
      [disabled]="loading()"
      routerLink="/login"
      i18n
    >
      Login
    </button>
  </app-card-secondary-content>
</app-base-auth-page>
