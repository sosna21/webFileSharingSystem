<div
  class="modal-header bg-primary-subtle d-flex"
  data-testid="file-share-modal-header"
>
  <h4 class="modal-title" data-testid="file-share-modal-title">
    {{ title() }}
  </h4>
  <button
    type="button"
    class="btn-close position-relative top-0 end-0"
    aria-label="Close"
    (click)="activeModal.dismiss()"
  ></button>
</div>

<div class="modal-body">
  @if (shareToModify()) {
    <div class="mb-2">
      <label for="shareWith" class="form-label fs-5">Sharing with</label>
      <div class="mx-2">
        <input
          disabled
          id="shareWith"
          type="text"
          class="form-control"
          data-testid="file-share-modal-share-with"
          [value]="shareToModify()?.sharedWithUserName"
        />
        <div class="invalid-feedback">
          Please enter a valid username or email.
        </div>
      </div>
    </div>

    <div class="mb-2">
      <label class="form-label fs-5">Permission Level</label>
      <div class="mx-2">
        <div class="form-check">
          <input
            class="form-check-input"
            type="radio"
            name="permission"
            id="readOnly"
            data-testid="file-share-modal-permission-read-only"
            [checked]="selectedPermission() === ShareAccessMode.ReadOnly"
            (change)="setPermission(ShareAccessMode.ReadOnly)"
          />
          <label class="form-check-label" for="readOnly">
            <strong>Read Only</strong>
            <div class="text-muted small">Can view and download the file</div>
          </label>
        </div>
        <div class="form-check">
          <input
            class="form-check-input"
            type="radio"
            name="permission"
            id="readWrite"
            data-testid="file-share-modal-permission-read-write"
            [checked]="selectedPermission() === ShareAccessMode.ReadWrite"
            (change)="setPermission(ShareAccessMode.ReadWrite)"
          />
          <label class="form-check-label" for="readWrite">
            <strong>Read and Write</strong>
            <div class="text-muted small">
              Can view, download, and modify the file
            </div>
          </label>
        </div>
        <div class="form-check">
          <input
            class="form-check-input"
            type="radio"
            name="permission"
            id="fullControl"
            data-testid="file-share-modal-permission-full-control"
            [checked]="selectedPermission() === ShareAccessMode.FullAccess"
            (change)="setPermission(ShareAccessMode.FullAccess)"
          />
          <label class="form-check-label" for="fullControl">
            <strong>Full Control</strong>
            <div class="text-muted small">
              Can view, modify, delete, and share the file
            </div>
          </label>
        </div>
      </div>
    </div>

    <div class="mb-2">
      <label for="shareDuration" class="form-label fs-5 mb-0"
        >Share Duration</label
      >
      <div
        class="form-text ms-2 mt-0 mb-2 d-grid"
        style="grid-template-columns: auto 1fr"
      >
        <div>Previous expiration:&nbsp;</div>
        <div>
          {{ shareToModifyDateString() }}
        </div>

        @if (shareDuration() !== -2) {
          <div>New expiration:&nbsp;</div>
          <div>
            {{ newShareValidToString() }}
          </div>
        }
      </div>

      <div class="mx-2">
        <select
          id="shareDuration"
          class="form-select"
          data-testid="file-share-modal-share-duration"
          [(ngModel)]="shareDuration"
          (change)="onDurationChange($event)"
        >
          <option [ngValue]="-2">Do not change</option>
          <option [ngValue]="1">1 hour</option>
          <option [ngValue]="24">24 hours</option>
          <option [ngValue]="168">1 week</option>
          <option [ngValue]="720">30 days</option>
          <option [ngValue]="-1">Indefinite</option>
          <option [ngValue]="0">
            Custom{{
              selectedCustomDurationString() &&
                ": " + selectedCustomDurationString()
            }}
          </option>
        </select>
      </div>
    </div>
  } @else {
    <div class="text-center">Unexpected error: No share provided.</div>
  }
</div>

<div class="modal-footer" data-testid="file-share-modal-footer">
  <button
    type="button"
    class="btn btn-warning me-auto w-25"
    data-testid="file-share-modal-reset"
    (click)="resetValues()"
  >
    Reset
  </button>

  <button
    type="button"
    class="btn btn-outline-secondary"
    data-testid="file-share-modal-cancel"
    (click)="activeModal.dismiss()"
  >
    Cancel
  </button>
  <button
    type="button"
    class="btn btn-success"
    style="width: 30%"
    data-testid="file-share-modal-confirm"
    ngbAutofocus
    (click)="confirm()"
  >
    Save Changes
  </button>
</div>
