<div
  class="modal-header bg-primary-subtle d-flex"
  data-testid="file-share-modal-header"
>
  <h4 class="modal-title" data-testid="file-share-modal-title">
    {{ title() }}
  </h4>

  <button
    type="button"
    class="btn-close position-relative top-0 end-0"
    aria-label="Close"
    (click)="activeModal.dismiss()"
  ></button>
</div>

<div class="modal-body">
  <div class="mb-2">
    <label for="shareWith" class="form-label fs-5" i18n>Share with</label>
    <div class="mx-2">
      <input
        id="shareWith"
        type="text"
        class="form-control"
        data-testid="file-share-modal-share-with"
        placeholder="Enter username or email to share the file with"
        [(ngModel)]="shareWith"
      />
      <div class="invalid-feedback" i18n>
        Please enter a valid username or email.
      </div>
      <div class="form-text" i18n>
        You can share the file with multiple users by separating their emails
        with commas.
      </div>
    </div>
  </div>

  <div class="mb-2">
    <label class="form-label fs-5" i18n>Permission Level</label>
    <div class="mx-2">
      <div class="form-check">
        <input
          class="form-check-input"
          type="radio"
          name="permission"
          id="readOnly"
          data-testid="file-share-modal-permission-read-only"
          [checked]="selectedPermission() === ShareAccessMode.ReadOnly"
          (change)="setPermission(ShareAccessMode.ReadOnly)"
        />
        <label class="form-check-label" for="readOnly">
          <strong i18n>Read Only</strong>
          <div class="text-muted small" i18n>
            Can view and download the file
          </div>
        </label>
      </div>
      <div class="form-check">
        <input
          class="form-check-input"
          type="radio"
          name="permission"
          id="readWrite"
          data-testid="file-share-modal-permission-read-write"
          [checked]="selectedPermission() === ShareAccessMode.ReadWrite"
          (change)="setPermission(ShareAccessMode.ReadWrite)"
        />
        <label class="form-check-label" for="readWrite">
          <strong i18n>Read and Write</strong>
          <div class="text-muted small" i18n>
            Can view, download, and modify the file
          </div>
        </label>
      </div>
      <div class="form-check">
        <input
          class="form-check-input"
          type="radio"
          name="permission"
          id="fullControl"
          data-testid="file-share-modal-permission-full-control"
          [checked]="selectedPermission() === ShareAccessMode.FullAccess"
          (change)="setPermission(ShareAccessMode.FullAccess)"
        />
        <label class="form-check-label" for="fullControl">
          <strong i18n>Full Control</strong>
          <div class="text-muted small" i18n>
            Can view, modify and delete the file
          </div>
        </label>
      </div>
    </div>
  </div>

  <div class="mb-2">
    <label for="shareDuration" class="form-label fs-5" i18n
      >Share Duration</label
    >
    <div class="mx-2">
      <select
        id="shareDuration"
        class="form-select"
        data-testid="file-share-modal-share-duration"
        [(ngModel)]="shareDuration"
        (change)="onDurationChange($event)"
      >
        <option [ngValue]="1" i18n>1 hour</option>
        <option [ngValue]="24" i18n>24 hours</option>
        <option [ngValue]="168" i18n>1 week</option>
        <option [ngValue]="720" i18n>30 days</option>
        <option [ngValue]="-1" i18n>Indefinite</option>
        <option [ngValue]="0" i18n>
          Custom{{
            selectedCustomDurationString() &&
              ": " + selectedCustomDurationString()
          }}
        </option>
      </select>
    </div>
  </div>
</div>

<div class="modal-footer" data-testid="file-share-modal-footer">
  <!-- Style link generation -->
  <button
    type="button"
    class="link-cta me-auto"
    data-testid="file-share-modal-generate-link"
    (click)="generateShareLink()"
    aria-label="Generate share link"
  >
    <i class="bi bi-link-45deg" aria-hidden="true"></i>
    <span i18n>Generate share link instead</span>
    <i class="bi bi-chevron-right chevron" aria-hidden="true"></i>
  </button>
  <button
    type="button"
    class="btn btn-outline-secondary"
    data-testid="file-share-modal-cancel"
    (click)="activeModal.dismiss()"
  >
    {{ cancelText() }}
  </button>
  <button
    type="button"
    class="btn btn-success w-25"
    data-testid="file-share-modal-confirm"
    ngbAutofocus
    [disabled]="!shareWith()"
    (click)="confirm()"
  >
    {{ confirmText() }}
  </button>
</div>
