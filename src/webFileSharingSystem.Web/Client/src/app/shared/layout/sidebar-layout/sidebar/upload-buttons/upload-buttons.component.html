<label
  class="btn btn-info px-0 py-3"
  [class.disabled]="!canUpload()"
  tabindex="0"
  role="button"
>
  <input
    [disabled]="!canUpload()"
    type="file"
    class="d-none"
    multiple
    (change)="uploadSelectedFiles($event)"
    data-testid="upload-files-input"
  />
  Upload files
</label>
<label
  class="btn btn-info px-0 py-3"
  [class.disabled]="!canUpload()"
  tabindex="0"
  role="button"
>
  <input
    [disabled]="!canUpload()"
    type="file"
    class="d-none"
    webkitdirectory
    (change)="uploadSelectedFolder($event)"
    data-testid="upload-folder-input"
  />
  Upload folder
</label>
