<div
  ngbDropdown
  appHoverClass="bg-secondary"
  class="dropdown text-end p-1 me-4 rounded-pill"
>
  <span
    ngbDropdownToggle
    class="d-block dropdown-toggle text-white"
    style="cursor: pointer"
  >
    <img
      [src]="userPhotoUrl() ?? 'user.png'"
      [alt]="'Profile photo of ' + userName()"
      width="32"
      height="32"
      class="rounded-circle"
    />
    {{ userName() }}
  </span>
  <ul ngbDropdownMenu class="dropdown-menu text-small">
    <li ngbDropdownItem>
      <a
        class="dropdown-item user-select-none"
        routerLink="/settings"
        draggable="false"
      >
        <i class="bi bi-gear"></i>
        Settings
      </a>
    </li>
    <li ngbDropdownItem>
      <a
        class="dropdown-item user-select-none"
        routerLink="/profile"
        draggable="false"
      >
        <i class="bi bi-person-lines-fill"></i>
        Profile
      </a>
    </li>
    <li><hr class="dropdown-divider" /></li>
    <li ngbDropdownItem>
      <a
        class="dropdown-item user-select-none"
        (click)="logout()"
        draggable="false"
      >
        <i class="bi bi-power"></i>
        Sign out
      </a>
    </li>
  </ul>
</div>
