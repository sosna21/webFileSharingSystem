<div
  ngbDropdown
  appHoverClass="bg-secondary"
  class="dropdown text-end p-1 me-4 rounded-pill"
>
  <span
    ngbDropdownToggle
    class="d-block dropdown-toggle text-white"
    style="cursor: pointer"
  >
    <img
      [src]="userPhotoUrl || 'user.png'"
      alt="user proffile pic"
      width="32"
      height="32"
      class="rounded-circle"
    />
    {{ userName }}
  </span>
  <ul ngbDropdownMenu class="dropdown-menu text-small">
    <li ngbDropdownItem>
      <a class="dropdown-item" routerLink="/settings">
        <i class="bi bi-gear"></i>
        Settings
      </a>
    </li>
    <li ngbDropdownItem>
      <a class="dropdown-item" routerLink="/profile">
        <i class="bi bi-person-lines-fill"></i>
        Profile
      </a>
    </li>
    <li><hr class="dropdown-divider" /></li>
    <li ngbDropdownItem>
      <a class="dropdown-item" (click)="logout()">
        <i class="bi bi-power"></i>
        Sign out
      </a>
    </li>
  </ul>
</div>
