@let formattedCreatedBy =
  file().createdBy === currentUserId() ? "You" : file().createdByUserName;
<img
  [src]="userPhotoUrl() ?? 'user.png'"
  [alt]="'Profile photo of ' + formattedCreatedBy"
  width="32"
  height="32"
  class="rounded-circle me-2"
/>
<span class="text-truncate" [appTooltipOnOverflow]="formattedCreatedBy">
  {{ formattedCreatedBy }}
</span>
