@let formattedCreatedBy =
  file().createdBy === currentUserId()
    ? currentUserLabel
    : file().createdByUserName;
<img
  [src]="userPhotoUrl() ?? 'user.png'"
  [alt]="`Profile photo of ${formattedCreatedBy}`"
  i18n-alt
  width="32"
  height="32"
  [class]="'rounded-circle ' + photoTextGapClass()"
/>
<span
  class="text-truncate"
  [class.mt-auto]="alignTextBottom()"
  [appTooltipOnOverflow]="formattedCreatedBy"
>
  {{ formattedCreatedBy }}
</span>
