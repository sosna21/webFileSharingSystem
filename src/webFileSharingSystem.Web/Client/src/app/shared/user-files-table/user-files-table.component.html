<app-user-files-context-menu
  [position]="contextMenuPosition()"
  [selectedFiles]="selectedFiles()"
  (openFolder)="selectFolder($event.id)"
  (rename)="initRename($event)"
  (toggleFavourite)="changeFavourite(this.selectedFiles(), $event)"
  (delete)="deleteFiles($event)"
  (share)="shareFile($event)"
  (manageShares)="showShareManagementModal($event)"
  (selectFolder)="selectFolder($event)"
  (pauseUpload)="stopFilesUpload($event)"
  (resumeUpload)="continueFilesUpload($event)"
  (cancelUpload)="cancelFilesUpload($event)"
  (move)="initFileMove($event)"
  (copy)="initFileCopy($event)"
  (download)="downloadFiles($event)"
  (generateLink)="generateShareLink($event)"
/>

<app-table-context-menu
  [position]="contextMenuPosition()"
  [accessMode]="undefined"
  [sortableColumns]="columnsToDisplay()"
  [canPaste]="canPaste()"
  (refresh)="refresh()"
  (createFolder)="createFolder()"
  (upload)="uploadFiles($event)"
  (paste)="pasteFiles()"
/>

<div
  class="table-wrapper position-relative h-100 rounded rounded-4 px-2 py-3"
  [class.table-drop-hover]="isHoverTargetATable()"
  (mouseup)="resetFileSelection($event)"
  (contextmenu)="tableContextMenuClick($event)"
>
  <div
    (dragleave)="onTableDragLeave($event)"
    (dragenter)="onTableDragEnter($event)"
    (dragover)="onTableDragOver($event)"
    (drop)="onTableDrop($event)"
    class="table-scroll-wrapper overflow-auto h-100 px-1"
  >
    <table
      cdk-table
      [dataSource]="files()"
      [trackBy]="trackByFileId"
      recycleRows
      class="table table-hover table-sm no-select my-0"
    >
      <!-- File id Definition -->
      <ng-container cdkColumnDef="id">
        <th cdk-header-cell *cdkHeaderCellDef scope="col" style="width: 3%">
          Id
        </th>
        <td cdk-cell *cdkCellDef="let file">{{ file.id }}</td>
      </ng-container>

      <!-- Row Selector Definition -->
      <ng-container cdkColumnDef="rowSelector">
        <th cdk-header-cell *cdkHeaderCellDef scope="col" style="width: 3%">
          <label class="lbl-checkbox">
            <input
              type="checkbox"
              [checked]="areAllCheckboxesChecked()"
              (change)="checkAllCheckBox($event)"
            />
          </label>
        </th>
        <td
          cdk-cell
          *cdkCellDef="let file"
          class="d-table-cell align-middle text-center"
        >
          <app-row-selector-cell
            [file]="file"
            [isLoading]="isLoading(file.id)"
            (cancelFilesUpload)="cancelFilesUpload($event)"
          />
        </td>
      </ng-container>

      <!-- File name Definition -->
      <ng-container cdkColumnDef="fileName">
        <th cdk-header-cell *cdkHeaderCellDef scope="col" class="text-left">
          FileName
        </th>
        <td cdk-cell *cdkCellDef="let file">
          <app-file-name-cell
            [file]="file"
            [editingId]="editingId()"
            (contextMenuClick)="contextMenuClick($event.event, $event.file)"
            (rename)="rename($event.file, $event.newName)"
            (fileRenameKeyDown)="fileRenameKeyDown($event.event, $event.file)"
            (stopFilesUpload)="stopFilesUpload($event)"
            (continueFilesUpload)="continueFilesUpload($event)"
          />
        </td>
      </ng-container>

      <!-- Favourite Definition -->
      <ng-container cdkColumnDef="favourite">
        <th
          cdk-header-cell
          *cdkHeaderCellDef
          scope="col"
          class="d-none d-md-table-cell"
          style="width: 5%"
        >
          Favourite
        </th>
        <td
          cdk-cell
          *cdkCellDef="let file"
          class="d-none d-md-table-cell align-middle"
        >
          <app-favourite-cell
            [file]="file"
            (contextMenuClick)="contextMenuClick($event.event, $event.file)"
            (changeFavourite)="
              changeFavourite($event.files, $event.isFavourite)
            "
          />
        </td>
      </ng-container>

      <!-- Share Definition -->
      <ng-container cdkColumnDef="share">
        <th
          cdk-header-cell
          *cdkHeaderCellDef
          scope="col"
          class="d-none d-md-table-cell"
          style="width: 5%"
        >
          Share
        </th>
        <td
          cdk-cell
          *cdkCellDef="let file"
          class="d-none d-md-table-cell align-middle"
        >
          <app-share-cell
            [file]="file"
            (contextMenuClick)="contextMenuClick($event.event, $event.file)"
            (showShareManagementModal)="showShareManagementModal($event)"
            (shareFile)="shareFile($event)"
          />
        </td>
      </ng-container>

      <!-- Actions Definition -->
      <ng-container cdkColumnDef="actions">
        <th cdk-header-cell *cdkHeaderCellDef scope="col" style="width: 5%">
          Actions
        </th>
        <td cdk-cell *cdkCellDef="let file" class="d-table-cell align-middle">
          <app-actions-cell
            [file]="file"
            (contextMenuClick)="contextMenuClick($event.event, $event.file)"
            (actionIconClick)="
              actionIconClick($event.event, $event.icon, $event.file)
            "
          />
        </td>
      </ng-container>

      <!-- Size  Definition -->
      <ng-container cdkColumnDef="size">
        <th cdk-header-cell *cdkHeaderCellDef scope="col" style="width: 6%">
          Size
        </th>
        <td cdk-cell *cdkCellDef="let file" class="d-table-cell align-middle">
          <app-size-cell
            [file]="file"
            (contextMenuClick)="contextMenuClick($event.event, $event.file)"
          />
        </td>
      </ng-container>

      <!-- Last Modification Definition -->
      <ng-container cdkColumnDef="lastModification">
        <th
          cdk-header-cell
          *cdkHeaderCellDef
          scope="col"
          class="d-none d-sm-table-cell"
          style="width: 12%"
        >
          Last Modification
        </th>
        <td
          cdk-cell
          *cdkCellDef="let file"
          class="d-none d-sm-table-cell align-middle"
        >
          <app-last-modification-cell
            [file]="file"
            (contextMenuClick)="contextMenuClick($event.event, $event.file)"
          />
        </td>
      </ng-container>

      <!-- Header and Row Declarations -->
      <tr *cdkNoDataRow>
        <td colspan="100%" class="text-center fs-5">Empty directory</td>
      </tr>

      <tr
        cdk-header-row
        *cdkHeaderRowDef="columnsToDisplay(); sticky: true"
        class="table-primary"
      ></tr>

      <tr
        cdk-row
        *cdkRowDef="let file; columns: columnsToDisplay()"
        (contextmenu)="
          isSelected(file.id)
            ? contextMenuClick($event, file)
            : tableContextMenuClick($event)
        "
        (click)="selectFile(file, $event)"
        (dblclick)="file.isDirectory ? selectFolder(file.id) : null"
        class="bg-transparent"
        [class.selected-row]="selectedIds().has(file.id)"
        [class.selectable]="file.isDirectory"
        [draggable]="
          file.fileStatus === FileStatus.Completed &&
          !isLoading(file.id) &&
          !isEditing(file.id)
        "
        (dragstart)="onRowDragStart($event, file)"
        (dragleave)="onRowDragLeave($event, file)"
        (dragenter)="onRowDragEnter($event, file)"
        (dragover)="onRowDragOver($event)"
        (drop)="onRowDrop($event, file)"
        (mousedown)="onRowMouseDown(file, $event)"
        (mouseenter)="onRowMouseEnter(file)"
        (mouseup)="onRowMouseUp(file, $event)"
        [class.opacity-50]="
          filesMarkedForAction()?.type === 1 &&
          filesMarkedForAction()?.filesIds!.has(file.id)
        "
        [class.drop-folder-hover]="
          dragTarget()?.id === file.id && canBeTargetDirectory(file)
        "
      ></tr>
    </table>

    @if (files().length === 0) {
      <div
        class="text-center text-secondary position-absolute top-50 start-50 translate-middle"
      >
        <i class="bi bi-upload" style="font-size: 5rem"></i>
        <div class="fs-3">Drop files here to upload</div>
      </div>
    }
  </div>

  @if (dragTarget() && !isInternalHover()) {
    <app-upload-overlay />
  }
</div>

<!-- Do not remove this -->
<!-- Invisible drag preview component, necessary for drag preview view snapshot -->
<div style="position: absolute; top: -9999px; left: -9999px">
  <app-drag-preview [files]="selectedFiles()" />
</div>
