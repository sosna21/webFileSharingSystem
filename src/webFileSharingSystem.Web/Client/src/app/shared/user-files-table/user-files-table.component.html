<app-user-files-context-menu
  [position]="contextMenuPosition()"
  [selectedFiles]="selectedFiles()"
  (openFolder)="selectFolder($event.id)"
  (openLocation)="openLocation($event)"
  (rename)="initRename($event)"
  (toggleFavourite)="changeFavourite(this.selectedFiles(), $event)"
  (delete)="deleteFiles($event)"
  (share)="shareFile($event)"
  (manageShares)="showShareManagementModal($event)"
  (selectFolder)="selectFolder($event)"
  (pauseUpload)="stopFilesUpload($event)"
  (resumeUpload)="continueFilesUpload($event)"
  (cancelUpload)="cancelFilesUpload($event)"
  (move)="initFileMove($event)"
  (copy)="initFileCopy($event)"
  (download)="downloadFiles($event)"
  (generateLink)="generateShareLink($event)"
/>

<app-table-context-menu
  [position]="contextMenuPosition()"
  [accessMode]="currentDirectoryAccessMode()"
  [sortableColumns]="sortableColumns()"
  [sortOption]="sortOption()"
  [canPaste]="canPaste()"
  [(viewMode)]="viewMode"
  (refresh)="refresh()"
  (createFolder)="createFolder()"
  (upload)="uploadFiles($event)"
  (paste)="pasteFiles()"
  (sortByColumn)="toggleSort($event)"
/>

<div
  class="table-wrapper position-relative h-100 rounded rounded-4 px-2 py-3"
  data-testid="user-files-table"
  [class.table-drop-hover]="isHoverTargetATable()"
  (pointerdown)="onRubberBandPointerDown($event)"
  (pointerup)="viewWrapperClick($event)"
  (contextmenu)="tableContextMenuClick($event)"
>
  <div
    #scrollContainer
    data-testid="files-drop-area"
    (scroll)="onRubberBandScroll()"
    (dragleave)="onTableDragLeave($event)"
    (dragenter)="onTableDragEnter($event)"
    (dragover)="onTableDragOver($event)"
    (drop)="onTableDrop($event)"
    class="table-scroll-wrapper position-relative overflow-auto h-100 px-1"
  >
    <table
      cdk-table
      fixedLayout
      [dataSource]="files()"
      [trackBy]="trackByFileId"
      recycleRows
      class="table table-hover table-sm no-select my-0"
    >
      <!-- Row Selector Definition -->
      <ng-container cdkColumnDef="rowSelector">
        <th cdk-header-cell *cdkHeaderCellDef scope="col" style="width: 40px">
          <label class="lbl-checkbox">
            <input
              type="checkbox"
              [checked]="areAllCheckboxesChecked()"
              (change)="checkAllCheckBox($event)"
            />
          </label>
        </th>
        <td
          cdk-cell
          *cdkCellDef="let file"
          class="d-table-cell align-middle text-center"
        >
          <app-row-selector-cell
            [file]="file"
            [isLoading]="isLoading(file.id)"
            (cancelFilesUpload)="cancelFilesUpload($event)"
          />
        </td>
      </ng-container>

      <!-- File name Definition -->
      <ng-container cdkColumnDef="fileName">
        <th
          cdk-header-cell
          *cdkHeaderCellDef
          scope="col"
          (click)="toggleSort('fileName')"
          data-testid="header-name"
        >
          <app-sortable-header
            column="fileName"
            [sortOption]="sortOption()"
            i18n
          >
            File Name
          </app-sortable-header>
        </th>
        <td
          cdk-cell
          *cdkCellDef="let file"
          [appTooltipOnOverflow]="file.fileName"
        >
          <app-file-name-cell
            [file]="file"
            [editingId]="editingId()"
            (contextMenuClick)="contextMenuClick($event.event, $event.file)"
            (rename)="rename($event.file, $event.newName)"
            (fileRenameKeyDown)="fileRenameKeyDown($event.event, $event.file)"
            (stopFilesUpload)="stopFilesUpload($event)"
            (continueFilesUpload)="continueFilesUpload($event)"
          />
        </td>
      </ng-container>

      <!-- Favourite Definition -->
      <ng-container cdkColumnDef="favourite">
        <th
          cdk-header-cell
          *cdkHeaderCellDef
          scope="col"
          class="d-none d-xl-table-cell favourite-column"
          (click)="toggleSort('favourite')"
        >
          <app-sortable-header
            column="favourite"
            [sortOption]="sortOption()"
            i18n
          >
            Favourite
          </app-sortable-header>
        </th>
        <td
          cdk-cell
          *cdkCellDef="let file"
          class="d-none d-xl-table-cell align-middle"
        >
          <app-favourite-cell
            [file]="file"
            (contextMenuClick)="contextMenuClick($event.event, $event.file)"
            (changeFavourite)="
              changeFavourite($event.files, $event.isFavourite)
            "
          />
        </td>
      </ng-container>

      <!-- Share Definition -->
      <ng-container cdkColumnDef="share">
        <th
          cdk-header-cell
          *cdkHeaderCellDef
          scope="col"
          class="d-none d-xl-table-cell share-column"
          (click)="toggleSort('share')"
        >
          <app-sortable-header column="share" [sortOption]="sortOption()" i18n>
            Share
          </app-sortable-header>
        </th>
        <td
          cdk-cell
          *cdkCellDef="let file"
          class="d-none d-xl-table-cell align-middle"
        >
          <app-share-cell
            [file]="file"
            (contextMenuClick)="contextMenuClick($event.event, $event.file)"
            (showShareManagementModal)="showShareManagementModal($event)"
            (shareFile)="shareFile($event)"
          />
        </td>
      </ng-container>

      <!-- Actions Definition -->
      <ng-container cdkColumnDef="actions">
        <th
          cdk-header-cell
          *cdkHeaderCellDef
          scope="col"
          class="actions-column"
          i18n
        >
          Actions
        </th>
        <td cdk-cell *cdkCellDef="let file" class="d-table-cell align-middle">
          <app-actions-cell
            [file]="file"
            (contextMenuClick)="contextMenuClick($event.event, $event.file)"
            (actionIconClick)="actionIconClick($event.event, $event.file)"
          />
        </td>
      </ng-container>

      <!-- Size  Definition -->
      <ng-container cdkColumnDef="size">
        <th
          cdk-header-cell
          *cdkHeaderCellDef
          scope="col"
          class="size-column"
          (click)="toggleSort('size')"
          data-testid="header-size"
        >
          <app-sortable-header column="size" [sortOption]="sortOption()" i18n>
            Size
          </app-sortable-header>
        </th>
        <td cdk-cell *cdkCellDef="let file" class="d-table-cell align-middle">
          <app-size-cell
            [file]="file"
            (contextMenuClick)="contextMenuClick($event.event, $event.file)"
          />
        </td>
      </ng-container>

      <!-- Created By Definition -->
      <ng-container cdkColumnDef="createdByUserName">
        <th
          cdk-header-cell
          *cdkHeaderCellDef
          scope="col"
          class="d-none d-sm-table-cell"
          style="width: 150px"
          (click)="toggleSort('createdByUserName')"
        >
          <app-sortable-header
            column="createdByUserName"
            [sortOption]="sortOption()"
            i18n
          >
            Created By
          </app-sortable-header>
        </th>
        <td cdk-cell *cdkCellDef="let file" class="d-none d-sm-table-cell pe-2">
          <app-created-by-cell
            [file]="file"
            (contextMenuClick)="contextMenuClick($event.event, $event.file)"
          />
        </td>
      </ng-container>

      <!-- Last Modification Definition -->
      <ng-container cdkColumnDef="lastModification">
        <th
          cdk-header-cell
          *cdkHeaderCellDef
          scope="col"
          class="d-none d-md-table-cell last-mod-column"
          (click)="toggleSort('lastModification')"
          data-testid="header-modified"
        >
          <app-sortable-header
            column="lastModification"
            [sortOption]="sortOption()"
            i18n
          >
            Last Modification
          </app-sortable-header>
        </th>
        <td
          cdk-cell
          *cdkCellDef="let file"
          class="d-none d-md-table-cell align-middle"
        >
          <app-last-modification-cell
            [file]="file"
            (contextMenuClick)="contextMenuClick($event.event, $event.file)"
          />
        </td>
      </ng-container>

      <!-- Header and Row Declarations -->
      <tr *cdkNoDataRow></tr>
      <!-- Leave Empty - Required for correct display of "No data" row when there are no files -->

      <tr
        cdk-header-row
        *cdkHeaderRowDef="columnsToDisplay(); sticky: true"
        class="table-primary"
      ></tr>

      <tr
        cdk-row
        *cdkRowDef="let file; columns: columnsToDisplay()"
        [attr.data-testid]="
          (file.fileStatus === FileStatus.Completed
            ? 'file-row-'
            : 'upload-row-') + file.fileName
        "
        (contextmenu)="
          isSelected(file.id)
            ? contextMenuClick($event, file)
            : tableContextMenuClick($event)
        "
        (click)="selectFile(file, $event)"
        (dblclick)="file.isDirectory ? selectFolder(file.id) : null"
        [class.table-active]="
          file.fileStatus === FileStatus.Incomplete &&
          file.createdBy !== currentUserId()
        "
        [class.selected-row]="selectedIds().has(file.id)"
        [class.selectable]="file.isDirectory"
        [draggable]="
          file.fileStatus === FileStatus.Completed &&
          !isLoading(file.id) &&
          !isEditing(file.id)
        "
        (dragstart)="onRowDragStart($event, file)"
        (dragend)="onRowDragEnd($event)"
        (dragleave)="onRowDragLeave($event, file)"
        (dragenter)="onRowDragEnter($event, file)"
        (dragover)="onRowDragOver($event)"
        (drop)="onRowDrop($event)"
        [class.opacity-50]="
          filesMarkedForAction()?.type === 1 &&
          filesMarkedForAction()?.filesIds!.has(file.id)
        "
        [attr.data-cut]="
          filesMarkedForAction()?.type === 1 &&
          filesMarkedForAction()?.filesIds!.has(file.id)
        "
        [class.drop-folder-hover]="
          dragTarget()?.id === file.id && canBeTargetDirectory(file)
        "
      ></tr>
    </table>

    @if (files().length === 0) {
      <div class="text-center fs-5 border ms-1 py-1" i18n>Empty directory</div>
      <div
        class="text-center text-secondary position-absolute top-50 start-50 translate-middle"
      >
        <i class="bi bi-upload" style="font-size: 5rem"></i>
        <div class="fs-3" i18n>Drop files here to upload</div>
      </div>
    }
  </div>

  <app-selection-area />

  @if (dragTarget() && !isInternalHover()) {
    <app-upload-overlay />
  }
</div>

<!-- Do not remove this -->
<!-- Invisible drag preview component, necessary for drag preview view snapshot -->
<div style="position: absolute; top: -9999px; left: -9999px">
  <app-drag-preview [files]="selectedFiles()" />
</div>
