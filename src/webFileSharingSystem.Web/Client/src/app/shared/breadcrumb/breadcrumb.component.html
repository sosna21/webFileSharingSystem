<nav aria-label="breadcrumb">
  <ol class="breadcrumb m-0">
    @for (breadcrumb of breadCrumbs(); track breadcrumb.id) {
      <li class="breadcrumb-item my-1" data-testid="breadcrumb-item">
        @if (!$last) {
          <a
            class="px-2 py-1"
            (drop)="onDrop($event, breadcrumb)"
            (dragenter)="onDragEnter($event, breadcrumb)"
            (dragover)="onDragOver($event)"
            (dragleave)="onDragLeave($event, breadcrumb)"
            [class]="
              dragOverBreadcrumbId() === breadcrumb.id
                ? 'bg-secondary bg-opacity-25 rounded-pill'
                : ''
            "
            [routerLink]="['/disc/home/folder', breadcrumb.id]"
            (click)="selectFolder(breadcrumb.id)"
          >
            <ng-container
              *ngTemplateOutlet="
                breadCrumbCore;
                context: { $implicit: breadcrumb, first: $first }
              "
            ></ng-container>
          </a>
        } @else {
          <span class="px-2 py-1 text-warning-emphasis">
            <ng-container
              *ngTemplateOutlet="
                breadCrumbCore;
                context: { $implicit: breadcrumb, first: $first }
              "
            ></ng-container>
          </span>
        }
      </li>
    }
  </ol>
</nav>

<ng-template #breadCrumbCore let-breadcrumb let-first="first">
  @if (first) {
    <i class="bi bi-house-door me-1"></i>
  } @else if (breadcrumb.accessMode) {
    <app-access-mode-icon
      [accessMode]="breadcrumb.accessMode"
      [withColor]="true"
      class="me-1"
    />
  }
  {{ breadcrumb.fileName }}
</ng-template>
